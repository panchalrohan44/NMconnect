<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat · SVKM Connect</title>
  <link rel="icon" href="logo.svg">
  <style>
    :root{--blue:#123d72;--light:#eef5fc;--ink:#17243a;--muted:#68778f;--line:#d8e3f0;--rose:#a94360}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:14px/1.45 Poppins,"Segoe UI",sans-serif}.shell{width:min(980px,calc(100% - 28px));margin:24px auto}.back{color:var(--blue);font-weight:600;text-decoration:none}.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 40px #123d7218;padding:18px}h1,h2{color:var(--blue);margin:0 0 5px}h1{font-size:25px}.muted,.empty{color:var(--muted)}.chat-list{display:grid;gap:8px;margin-top:14px}.chat-link{display:block;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.chat-link.active{border-color:var(--blue);background:var(--light)}.messages{height:52vh;overflow:auto;padding:12px 2px;display:grid;align-content:start;gap:9px}.bubble{max-width:78%;padding:10px 13px;border-radius:14px;background:var(--light)}.bubble.mine{justify-self:end;background:var(--blue);color:#fff}.bubble small{display:block;opacity:.7;font-size:10px;margin-top:3px}.composer{display:flex;gap:9px;border-top:1px solid var(--line);padding-top:14px}.composer input{flex:1;padding:12px;border:1px solid var(--line);border-radius:999px;font:inherit}.btn{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:11px 16px;font-weight:600;cursor:pointer}.assistant{margin-top:16px;background:#fff8fb;border:1px solid #f0d5df}.assistant button{background:#fff;color:var(--rose);border:1px solid #e6b8c6;margin:5px 5px 0 0;padding:8px 10px;border-radius:999px;cursor:pointer}.assistant-output{margin-top:10px;color:var(--muted);min-height:20px}@media(max-width:720px){.layout{grid-template-columns:1fr}.messages{height:48vh}}
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="./index.html">← Back to SVKM Connect</a>
    <div class="layout">
      <aside class="card"><h2>Chats</h2><p class="muted">Your accepted connections.</p><div class="chat-list" id="chat-list"><p class="empty">Loading...</p></div></aside>
      <section class="card"><h1 id="partner-name">Private chat</h1><p class="muted" id="partner-meta">Choose an accepted connection to start chatting.</p><div class="messages" id="messages"><p class="empty">Your messages will appear here.</p></div><form class="composer" id="message-form"><input id="message-input" maxlength="2000" placeholder="Write a message..." autocomplete="off" required><button class="btn" type="submit">Send</button></form><section class="assistant" id="assistant" hidden><strong>Conversation coach</strong><p class="muted">Need an opening line? I can suggest a friendly one.</p><button type="button" data-suggestion="What has been the highlight of your day?">Suggest a question</button><button type="button" data-suggestion="You seem fun to talk to — what are you into lately?">Suggest an opener</button><div class="assistant-output" id="assistant-output"></div></section></section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const client=window.supabase.createClient('https://sjwoyiwrvtrcezmgzosg.supabase.co','sb_publishable_s4dBdf87iuX7I0I0kNRQRg_5PI2rGN-');const $=s=>document.querySelector(s);const connectionId=new URLSearchParams(location.search).get('connection');let session,activeConnection;
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function init(){const result=await client.auth.getSession();session=result.data.session;if(!session){location.href='./auth.html';return}const mine=await client.from('profiles').select('is_bot').eq('id',session.user.id).maybeSingle();if(!mine.error&&!mine.data?.is_bot)$('#assistant').hidden=false;await loadConnections();}
    async function loadConnections(){const result=await client.from('connections').select('id,requester_id,recipient_id').or(`requester_id.eq.${session.user.id},recipient_id.eq.${session.user.id}`).eq('status','accepted').order('updated_at',{ascending:false});if(result.error){$('#chat-list').innerHTML='<p class="empty">Chat is unavailable until the chat_messages migration is applied.</p>';return}const rows=result.data||[];const ids=rows.map(row=>row.requester_id===session.user.id?row.recipient_id:row.requester_id);const profiles=await client.from('profiles').select('id,display_name,college,course').in('id',ids);const map=new Map((profiles.data||[]).map(profile=>[profile.id,profile]));$('#chat-list').innerHTML=rows.length?rows.map(row=>{const id=row.requester_id===session.user.id?row.recipient_id:row.requester_id;const partner=map.get(id)||{};return `<button class="chat-link${row.id===connectionId?' active':''}" data-connection="${row.id}">${escapeHtml(partner.display_name||'Campus connection')}<br><small>${escapeHtml(partner.course||'Student')}</small></button>`}).join(''):'<p class="empty">No accepted connections yet.</p>';document.querySelectorAll('[data-connection]').forEach(button=>button.addEventListener('click',()=>{location.href=`./chat.html?connection=${button.dataset.connection}`}));if(connectionId){activeConnection=rows.find(row=>row.id===connectionId);if(!activeConnection){$('#messages').innerHTML='<p class="empty">That connection is not available.</p>';return}const id=activeConnection.requester_id===session.user.id?activeConnection.recipient_id:activeConnection.requester_id;const profile=map.get(id)||{};$('#partner-name').textContent=profile.display_name||'Private chat';$('#partner-meta').textContent=[profile.course,profile.college].filter(Boolean).join(' · ');await loadMessages();}}
    async function loadMessages(){const result=await client.from('chat_messages').select('sender_id,body,created_at').eq('connection_id',connectionId).order('created_at');if(result.error){$('#messages').innerHTML='<p class="empty">Chat messages are unavailable. Apply the supplied schema migration first.</p>';return}$('#messages').innerHTML=result.data.length?result.data.map(message=>`<div class="bubble${message.sender_id===session.user.id?' mine':''}">${escapeHtml(message.body)}<small>${new Date(message.created_at).toLocaleString()}</small></div>`).join(''):'<p class="empty">Start the conversation with a friendly hello.</p>';$('#messages').scrollTop=$('#messages').scrollHeight;}
    $('#message-form').addEventListener('submit',async event=>{event.preventDefault();if(!activeConnection)return;const input=$('#message-input');const body=input.value.trim();if(!body)return;const result=await client.from('chat_messages').insert({connection_id:activeConnection.id,sender_id:session.user.id,body});if(result.error){$('#partner-meta').textContent=result.error.message;return}input.value='';await loadMessages();});
    document.querySelectorAll('[data-suggestion]').forEach(button=>button.addEventListener('click',()=>{$('#assistant-output').textContent=button.dataset.suggestion;$('#message-input').value=button.dataset.suggestion;$('#message-input').focus();}));
    init();
  </script>
</body>
</html>
