<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login · SVKM Connect</title>
  <meta name="description" content="Sign in or create your SVKM Connect account." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.cdnfonts.com/css/nefelibata-script" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async id="gsi-client"></script>
  <style>
    :root{
      --bg:#fcf1f6;
      --card:#ffffff;
      --muted:#a58997;
      --accent-1:#e997ba;
      --accent-2:#8cb2dd;
      --blue-light:#aecdf0;
      --pink-soft:#e79cb9;
      --blue-deep:#5276a3;
      --pink-deep:#c66b92;
      --ink:#45363e;
      --radius:18px;
      --ease: cubic-bezier(.16,.84,.29,1);
      --font-cursive:"Nefelibata Script","Dancing Script","Brush Script MT",cursive;
      --font-script:"Dancing Script","Brush Script MT",cursive;
      --font-body:"Poppins","Segoe UI",sans-serif;
      --shadow:0 12px 28px rgba(212,140,171,.16);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font-body);
      color:var(--ink);
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
      line-height:1.35;
      min-height:100%;
      padding:28px 16px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      overflow-x:hidden;
    }
    body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%}
    body:before{width:40vw;height:40vw;right:-16vw;top:10vh;background:var(--pink-soft);opacity:.18}
    body:after{width:32vw;height:32vw;left:-14vw;bottom:-6vh;background:var(--accent-2);opacity:.14}
    .auth-shell{width:100%;max-width:440px}
    .home{
      display:inline-flex;align-items:center;gap:6px;color:var(--blue-deep);
      text-decoration:none;font-size:14px;font-weight:600;margin-bottom:14px;
      padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--pink-soft);
    }
    .home:hover{color:var(--pink-deep)}
    .auth-card{
      background:var(--card);
      border:1px solid var(--pink-soft);
      border-radius:var(--radius);
      padding:28px 24px;
      box-shadow:var(--shadow);
      animation:cardRise .6s var(--ease) both;
    }
    @keyframes cardRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .title{
      font-family:var(--font-cursive);
      font-size:44px;
      color:var(--pink-deep);
      font-weight:400;
      margin:0 0 2px;
      line-height:1;
      text-align:center;
    }
    .tagline{font-family:var(--font-script);color:var(--muted);font-size:18px;text-align:center;margin:0 0 8px}
    .view h2{
      font-family:var(--font-cursive);
      color:var(--pink-deep);
      font-size:32px;
      font-weight:400;
      margin:12px 0 14px;
      text-align:center;
    }
    form{display:grid;gap:14px}
    label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
    input,select,textarea{
      width:100%;padding:12px 14px;
      border:1px solid var(--pink-soft);
      border-radius:10px;
      background:var(--bg);
      color:var(--ink);
      font:inherit;
    }
    textarea{resize:vertical;min-height:74px}
    input:focus,select:focus,textarea:focus{outline:2px solid var(--pink-soft);border-color:var(--accent-1);background:#fff}
    .pw{position:relative}
    .pw input{padding-right:78px}
    .reveal{
      position:absolute;right:8px;top:7px;
      padding:6px 12px;border:0;border-radius:999px;
      background:var(--pink-soft);color:#fff;
      cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font-body);
    }
    .reveal:hover{background:var(--pink-deep)}
    .btn{
      padding:12px 16px;border-radius:999px;
      background:var(--card);border:1px solid var(--pink-soft);
      cursor:pointer;color:var(--pink-deep);font-weight:600;font-family:var(--font-body);
      box-shadow:var(--shadow);
      transition:transform .22s var(--ease),background .22s var(--ease),color .22s var(--ease);
    }
    .btn:hover{transform:translateY(-2px)}
    .btn.primary{background:var(--accent-1);color:#fff;border:0;box-shadow:0 8px 22px rgba(233,151,186,.35);font-weight:700}
    .btn.primary:hover{background:var(--pink-deep)}
    .btn:disabled{opacity:.6;cursor:wait;transform:none}
    .btn.google{
      display:flex;align-items:center;justify-content:center;gap:10px;
      background:#fff;border:1px solid #e7c8d5;color:var(--ink);box-shadow:var(--shadow);
    }
    .btn.google svg{width:18px;height:18px}
    .btn.google:hover{background:var(--bg);border-color:var(--pink-deep)}
    .divider{
      display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0;
    }
    .divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--pink-soft)}
    .gsi-button{display:flex;justify-content:center;width:100%;margin-top:2px}
    .gsi-button iframe{width:100%}
    .switch{
      width:100%;margin-top:14px;padding:4px;border:0;background:transparent;
      color:var(--blue-deep);cursor:pointer;font:600 13px var(--font-body);text-decoration:underline;
    }
    .switch:hover{color:var(--pink-deep)}
    .status{min-height:20px;font-size:13px;color:var(--muted);text-align:center}
    .status.error{color:#c5487a}
    .status.success{color:var(--blue-deep)}
    .muted{color:var(--muted);font-size:13px;margin:0 0 14px;text-align:center}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .full{grid-column:1/-1}
    .note{font-size:11px;color:var(--muted);margin:2px 0 0}
    .legal-links{display:flex;justify-content:center;gap:8px;margin-top:16px;font-size:13px;color:var(--muted)}
    .legal-links a{color:var(--blue-deep);text-decoration:none;font-weight:600}
    .legal-links a:hover{color:var(--pink-deep)}
    @media (max-width:600px){.grid{grid-template-columns:1fr}.title{font-size:38px}.auth-card{padding:22px 16px}}
    @media (max-width:420px){.title{font-size:32px}.tagline{font-size:16px}.view h2{font-size:28px}.auth-shell{padding:4px}}
  </style>
</head>
<body>
  <div class="auth-shell">
    <a class="home" href="./index.html">← Back to SVKM Connect</a>
    <div class="auth-card">
      <h1 class="title">Find love at NM</h1>
      <p class="tagline">Verified campus community</p>

      <!-- SIGN IN -->
      <div class="view" id="view-signin">
        <h2>Sign in</h2>
        <form id="signin-form">
          <label>Gmail
            <input id="signin-email" type="email" placeholder="you@gmail.com" autocomplete="email" required />
          </label>
          <label>Password
            <div class="pw">
              <input id="signin-password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="current-password" required />
              <button class="reveal" type="button" data-for="signin-password" aria-label="Show password">Show</button>
            </div>
          </label>
          <button class="btn primary" id="signin-submit" type="submit">Sign in</button>
          <div class="status" id="signin-status" role="status" aria-live="polite"></div>
        </form>
        <div class="divider">or</div>
        <div class="gsi-button" id="gsi-signin"></div>
        <button class="switch" id="to-signup" type="button">New here? Create account</button>
      </div>

      <!-- CREATE ACCOUNT -->
      <div class="view" id="view-signup" hidden>
        <h2>Create account</h2>
        <form id="signup-form">
          <label>Gmail
            <input id="signup-email" type="email" placeholder="you@gmail.com" autocomplete="email" required />
          </label>
          <label>Password
            <div class="pw">
              <input id="signup-password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required />
              <button class="reveal" type="button" data-for="signup-password" aria-label="Show password">Show</button>
            </div>
            <span class="note">Use at least 8 characters.</span>
          </label>
          <label>Confirm password
            <div class="pw">
              <input id="signup-confirm" type="password" placeholder="Retype your password" minlength="8" autocomplete="new-password" required />
              <button class="reveal" type="button" data-for="signup-confirm" aria-label="Show password">Show</button>
            </div>
          </label>
          <button class="btn primary" id="signup-submit" type="submit">Create account</button>
          <div class="status" id="signup-status" role="status" aria-live="polite"></div>
        </form>
        <div class="divider">or</div>
        <div class="gsi-button" id="gsi-signup"></div>
        <button class="switch" id="to-signin" type="button">Already have an account? Sign in</button>
      </div>

      <!-- BUILD YOUR PROFILE (mandatory after account creation) -->
      <div class="view" id="view-profile" hidden>
        <h2>Build your profile</h2>
        <p class="muted">This powers your matches — what you fill here shows up on your profile.</p>
        <form id="profile-form">
          <div class="grid">
            <label class="full">Full name (shown on your profile)
              <input id="pf-name" type="text" placeholder="e.g. Ananya Sharma" autocomplete="name" required />
            </label>
            <label>Age
              <input id="pf-age" type="number" min="18" max="99" required />
            </label>
            <label>Gender
              <select id="pf-gender" required>
                <option value="">Choose gender</option>
                <option>Man</option>
                <option>Woman</option>
                <option>Non-binary</option>
                <option>Prefer not to say</option>
              </select>
            </label>
            <label>College
              <select id="pf-college" required>
                <option value="">Choose your college</option>
                <option value="mithibai">Mithibai College of Arts, Chauhan Institute of Science & Amrutben Jivanlal College</option>
                <option value="nm-commerce">Narsee Monjee College of Commerce and Economics (NM)</option>
                <option value="nmims">NMIMS (Deemed-to-be-University)</option>
                <option value="upg">Usha Pravin Gandhi College (UPG)</option>
                <option value="sbmp">Shri Bhagubhai Mafatlal Polytechnic (SBMP)</option>
                <option value="djsce">Dwarkadas J. Sanghvi College of Engineering (DJSCE)</option>
                <option value="jcl">Jitendra Chauhan College of Law (JCL)</option>
              </select>
            </label>
            <label>Course
              <select id="pf-course" required>
                <option value="">Choose course</option>
                <option value="bcom">B.Com</option>
                <option value="baf">B.Com (Accounting & Finance)</option>
                <option value="bbi">B.Com (Banking & Insurance)</option>
                <option value="bba">BBA</option>
                <option value="bms">BMS</option>
                <option value="bsc">B.Sc</option>
                <option value="bsc-it">B.Sc IT</option>
                <option value="ba">B.A.</option>
                <option value="bammc">B.A. Multimedia & Mass Communication</option>
                <option value="btech-cse">B.Tech Computer Engineering</option>
                <option value="llb">LL.B.</option>
              </select>
            </label>
            <label>Year
              <select id="pf-year" required>
                <option value="">Choose year</option>
                <option>FY (Freshman)</option>
                <option>SY (Sophomore)</option>
                <option>TY (Senior)</option>
                <option>Postgraduate</option>
              </select>
            </label>
            <label>Most-loved hangout
              <input id="pf-hangout" type="text" list="hangout-suggestions" placeholder="e.g. Canteen" required />
            </label>
            <label>Hobbies & interests
              <input id="pf-hobbies" type="text" placeholder="e.g. Music, books, football" required />
            </label>
            <label class="full">Clubs, fests & events you're part of
              <input id="pf-clubs" type="text" placeholder="e.g. Rotaract, Dance Society, Umang, Kshitij, Enactus (optional)" />
            </label>
            <label class="full">About you / bio
              <textarea id="pf-bio" rows="3" placeholder="A short intro — classes, societies, or what you're looking for (optional)"></textarea>
            </label>
            <label>Religion
              <input id="pf-religion" type="text" placeholder="Optional" />
            </label>
            <label>Mother tongue
              <input id="pf-mother-tongue" type="text" placeholder="e.g. Marathi" required />
            </label>
            <label>Instagram
              <input id="pf-instagram" type="text" placeholder="@yourhandle" />
            </label>
            <label>Snapchat
              <input id="pf-snapchat" type="text" placeholder="username" />
            </label>
            <label class="full">Other social handle
              <input id="pf-other-social" type="text" placeholder="Discord, X, LinkedIn..." />
            </label>
          </div>
          <datalist id="hangout-suggestions">
            <option value="Canteen"></option>
            <option value="Library"></option>
            <option value="Juhu Beach"></option>
            <option value="Study Hall"></option>
            <option value="Sports Complex"></option>
            <option value="Student Plaza"></option>
            <option value="Auditorium"></option>
          </datalist>
          <button class="btn primary" id="profile-save" type="submit">Save profile</button>
          <div class="status" id="profile-status" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
    <div class="legal-links">
      <a href="privacy.html">Privacy Policy</a>
      <span>·</span>
      <a href="terms.html">Terms &amp; Conditions</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* Add your Supabase project values here. Supabase Auth stores password hashes; this page never reads passwords. */
    const SUPABASE_URL = 'https://sjwoyiwrvtrcezmgzosg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_s4dBdf87iuX7I0I0kNRQRg_5PI2rGN-';

    /* Google OAuth "Web application" client ID. Must also be enabled in
       Supabase Dashboard → Authentication → Providers → Google with its client secret;
       and this site's origin must be in the client's Authorized JavaScript origins. */
    const GOOGLE_CLIENT_ID = '650627100892-686a2c1hf735djqj6i6l0fkl5eulvu6c.apps.googleusercontent.com';

    /* IMPORTANT: do NOT name this variable `supabase`. The @supabase/supabase-js CDN already declares
       a global `var supabase`, so re-declaring it as `const supabase` here throws
       "Identifier 'supabase' has already been declared" and disables the whole script. */
    const supabaseClient = window.supabase && !SUPABASE_URL.includes('YOUR-')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    let currentUser = null;

    function setStatus(id, message, type = '') {
      const el = $('#' + id);
      if (!el) return;
      el.className = `status ${type}`;
      el.textContent = message;
    }
    function showView(name) {
      $$('.view').forEach(v => { v.hidden = v.id !== 'view-' + name; });
    }

    /* Show / hide password toggles */
    $$('.reveal').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = $('#' + btn.dataset.for);
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        btn.textContent = visible ? 'Show' : 'Hide';
      });
    });

    /* Switch between sign in / sign up */
    $('#to-signup').addEventListener('click', () => { showView('signup'); setStatus('signup-status', ''); });
    $('#to-signin').addEventListener('click', () => { showView('signin'); setStatus('signin-status', ''); });

    async function hasProfile(userId) {
      if (!supabaseClient) return false;
      const { data } = await supabaseClient.from('profiles').select('id').eq('id', userId).maybeSingle();
      return !!data;
    }
    function goHome() { location.href = './index.html'; }

    /* A signed-in user must finish their profile before continuing (mandatory step). */
    async function handleActive(user) {
      currentUser = user;
      const exists = await hasProfile(user.id);
      if (exists) { goHome(); return; }
      showView('profile');
    }

    /* Sign in with email + password */
    $('#signin-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!supabaseClient) { setStatus('signin-status', 'Supabase is not configured yet.', 'error'); return; }
      const email = $('#signin-email').value.trim().toLowerCase();
      const password = $('#signin-password').value;
      const btn = $('#signin-submit');
      btn.disabled = true; setStatus('signin-status', 'Signing in...');
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { setStatus('signin-status', error.message, 'error'); return; }
        await handleActive(data.user);
      } catch (err) {
        setStatus('signin-status', err.message || 'Sign-in failed. Check your internet connection.', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    /* Create account with Gmail + password + confirm password */
    $('#signup-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!supabaseClient) { setStatus('signup-status', 'Supabase is not configured yet.', 'error'); return; }
      const email = $('#signup-email').value.trim().toLowerCase();
      const password = $('#signup-password').value;
      const confirm = $('#signup-confirm').value;
      const btn = $('#signup-submit');
      if (password.length < 8) { setStatus('signup-status', 'Password must be at least 8 characters.', 'error'); return; }
      if (password !== confirm) { setStatus('signup-status', 'Passwords do not match.', 'error'); return; }
      btn.disabled = true; setStatus('signup-status', 'Creating account...');
      try {
        /* Supabase records the email and password. The email is also kept as the profile login id. */
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { login_id: email } }
        });
        if (error) { setStatus('signup-status', error.message, 'error'); return; }
        if (!data.session) {
          setStatus('signup-status', 'Account created. Check your gmail to confirm, then sign in.', 'success');
          return;
        }
        await handleActive(data.user);
      } catch (err) {
        setStatus('signup-status', err.message || 'Sign-up failed. Check your internet connection.', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    /* Google sign in — Google Identity Services sends the ID token straight to Supabase (no redirect). */
    function handleGoogleCredential(credential, statusId) {
      if (!supabaseClient) { setStatus(statusId, 'Supabase is not configured yet.', 'error'); return; }
      setStatus(statusId, 'Signing in with Google...');
      supabaseClient.auth.signInWithIdToken({ provider: 'google', token: credential })
        .then(async ({ data, error }) => {
          if (error) {
            setStatus(statusId, error.message + ' Also enable Google in Supabase → Authentication → Providers → Google and register this client ID.', 'error');
            return;
          }
          await handleActive(data.user);
        })
        .catch(err => setStatus(statusId, err.message || 'Google sign-in failed.', 'error'));
    }

    function renderGoogleButton(containerId, statusId) {
      const el = document.getElementById(containerId);
      if (!el || el.childElementCount) return;
      const fallback = msg => {
        el.innerHTML = '<button class="btn google" type="button">Continue with Google</button>';
        el.querySelector('button').addEventListener('click', () => setStatus(statusId, msg, 'error'));
      };
      if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.startsWith('PASTE_')) {
        fallback('Google sign-in is not configured yet. Add your Google Web client ID.');
        return;
      }
      if (!window.google || !window.google.accounts) {
        fallback('Google sign-in script could not load. Check your internet connection and try again.');
        return;
      }
      try {
        window.google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: resp => handleGoogleCredential(resp.credential, statusId),
          auto_select: false
        });
        window.google.accounts.id.renderButton(el, {
          type: 'standard', theme: 'outline', text: 'continue_with', shape: 'pill',
          size: 'large', width: Math.min(380, Math.max(260, window.innerWidth - 88))
        });
      } catch (err) {
        fallback('Google sign-in could not start: ' + (err.message || 'invalid client ID.'));
      }
    }

    function initGoogleButtons() {
      renderGoogleButton('gsi-signin', 'signin-status');
      renderGoogleButton('gsi-signup', 'signup-status');
    }
    const gsiScript = document.querySelector('#gsi-client');
    if (window.google && window.google.accounts) { initGoogleButtons(); }
    else {
      let ggTries = 0;
      const waitGoogle = () => {
        if (window.google && window.google.accounts) { initGoogleButtons(); return; }
        if (++ggTries < 15) { setTimeout(waitGoogle, 250); }
        else { initGoogleButtons(); } // GSI unavailable: still show a helpful button
      };
      if (gsiScript) {
        gsiScript.addEventListener('load', waitGoogle);
        gsiScript.addEventListener('error', waitGoogle);
      }
      setTimeout(waitGoogle, 250);
    }

    /* Save the mandatory profile, then return to the main page */
    $('#profile-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!currentUser) { setStatus('profile-status', 'Session expired. Please sign in again.', 'error'); return; }
      const profile = {
        id: currentUser.id,
        login_id: currentUser.email || currentUser.id,
        email: currentUser.email || null,
        display_name: $('#pf-name').value.trim(),
        age: Number($('#pf-age').value),
        gender: $('#pf-gender').value,
        college: $('#pf-college').value,
        course: $('#pf-course').value,
        year: $('#pf-year').value,
        favourite_hangout: $('#pf-hangout').value.trim(),
        hobbies: $('#pf-hobbies').value.trim(),
        interests: $('#pf-hobbies').value.trim(),
        clubs_fests: $('#pf-clubs').value.trim(),
        bio: $('#pf-bio').value.trim(),
        religion: $('#pf-religion').value.trim(),
        mother_tongue: $('#pf-mother-tongue').value.trim(),
        social_handles: {
          instagram: $('#pf-instagram').value.trim(),
          snapchat: $('#pf-snapchat').value.trim(),
          other: $('#pf-other-social').value.trim()
        },
        updated_at: new Date().toISOString()
      };
      const btn = $('#profile-save');
      btn.disabled = true; setStatus('profile-status', 'Saving...');
      try {
        const { error } = await supabaseClient.from('profiles').upsert(profile);
        if (error) {
          setStatus('profile-status',
            /relation .*profiles.* does not exist/i.test(error.message)
              ? 'Create the profiles table using the supplied supabase-schema.sql file, then save again.'
              : error.message, 'error');
          return;
        }
        setStatus('profile-status', 'Profile saved. Welcome!', 'success');
        setTimeout(goHome, 700);
      } catch (err) {
        setStatus('profile-status', err.message || 'Could not save your profile.', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    /* Restore the session (handles the return from Google) */
    if (supabaseClient) {
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session?.user) handleActive(session.user);
      });
      supabaseClient.auth.onAuthStateChange((_event, session) => {
        if (_event === 'SIGNED_IN' && session?.user) handleActive(session.user);
      });
    }
  </script>
